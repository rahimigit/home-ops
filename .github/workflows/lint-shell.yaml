---
name: Lint Shell

on:
  # automatic triggers removed 2026-10-30 to stop burning hosted-runner minutes; run manually
  workflow_dispatch:

jobs:
  shelllint:
    name: Lint Shell
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v2
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          list-files: shell
          filters: |
            shell:
              - added|modified: "**.sh"
      - if: ${{ steps.filter.outputs.shell == 'true' }}
        uses: reviewdog/action-shellcheck@v1
        with:
          shellcheck_flags: "${{ steps.filter.outputs.shell_files }}"
