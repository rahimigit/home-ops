---
name: Lint YAML

on:
  # automatic triggers removed 2026-10-30 to stop burning hosted-runner minutes; run manually
  workflow_dispatch:

jobs:
  yamllint:
    name: Lint YAML
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v2
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          list-files: shell
          filters: |
            yaml:
              - added|modified: "**.yaml"
              - added|modified: "**.yml"
      - if: ${{ steps.filter.outputs.yaml == 'true' }}
        uses: reviewdog/action-yamllint@v1
        with:
          yamllint_flags: "-c .github/lint/.yamllint.yaml ${{ steps.filter.outputs.yaml_files }}"
